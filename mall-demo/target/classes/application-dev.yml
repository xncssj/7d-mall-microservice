server:
  port: 8082
spring:
  datasource:
    url: jdbc:mysql://10.211.55.15:3306/mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true&queryInterceptors=brave.mysql8.TracingQueryInterceptor&exceptionInterceptors=brave.mysql8.TracingExceptionInterceptor
    username: reader
    password: 123456
  redis:
    database: 0
    port: 6379
    host: 10.211.55.15
    password: 123456
  zipkin:
    base-url: http://10.211.55.15:9411 # Zipkin 服务器地址
    enabled: true
    discovery-client-enabled: false
    sender:
      type: web
    service:
      name: ${spring.application.name}
    compression:g
      enabled: true
  sleuth:
    propagation:
      tag:
        whitelisted-keys:
          - dunshan
        enabled: true
      keys:
        - dunshan
    sampler: #采样器
      probability: 1.0 #采样率，采样率是采集Trace的比率，默认0.1
      rate: 10000 #每秒数据采集量，最多n条/秒Trace
mybatis:
  mapper-locations:
    - classpath:mapper/*.xml
    - classpath*:com/**/mapper/*.xml
management: #开启SpringBoot Admin的监控
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
feign:
  okhttp:
    enabled: true