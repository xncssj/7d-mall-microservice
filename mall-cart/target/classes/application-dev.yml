server:
  port: 8086
  tomcat:
    accept-count: 1000
spring:
  datasource:
    druid:
      url: jdbc:mysql://10.211.55.15:3306/mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&queryInterceptors=brave.mysql8.TracingQueryInterceptor&exceptionInterceptors=brave.mysql8.TracingExceptionInterceptor
      username: reader
      password: 123456
      initial-size: 5 #连接池初始化大小
      min-idle: 10 #最小空闲连接数
      max-active: 20 #最大连接数
      web-stat-filter:
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*" #不统计这些请求数据
      stat-view-servlet: #访问监控网页的登录用户名和密码
        login-username: druid
        login-password: druid
  data:
    mongodb:
      uri: mongodb://admin:123456@10.211.55.15:27017/mall-port?authSource=admin # MongoDB 连接 URI（MongoDB 6.0 默认使用 SCRAM-SHA-256，也兼容 SCRAM-SHA-1）
      auto-index-creation: true
  redis:
    host: 10.211.55.15 # Redis服务器地址
    database: 0 # Redis数据库索引（默认为0）
    port: 6379 # Redis服务器连接端口
    password: 123456 # Redis服务器连接密码
    timeout: 3000ms # 连接超时时间（毫秒）
  rabbitmq:
    host: 10.211.55.15
    port: 5672 # RabbitMQ AMQP 端口（与 docker-compose.yml 一致）
    virtual-host: /mall
    username: admin # RabbitMQ 默认用户（与 docker-compose.yml 一致）
    password: 123456 # RabbitMQ 默认密码（与 docker-compose.yml 一致）
  zipkin:
    base-url: http://10.211.55.15:9411 # Zipkin 服务器地址
    enabled: true
    discovery-client-enabled: false
    sender:
      type: web
    service:
      name: ${spring.application.name}
    compression:
      enabled: true
  sleuth:
    propagation:
      tag:
        whitelisted-keys:
          - dunshan
        enabled: true
      keys:
        - dunshan
    sampler: #采样器
      probability: 1.0 #采样率，采样率是采集Trace的比率，默认0.1
      rate: 10000 #每秒数据采集量，最多n条/秒Trace
  jmx:
    enabled: true
mybatis:
  mapper-locations:
    - classpath:dao/*.xml
    - classpath*:com/**/mapper/*.xml
management: #开启SpringBoot Admin的监控
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
  health:
    mongo:
      enabled: false # 禁用 MongoDB 健康检查（如果 MongoDB 未配置或不可用）

# 自定义redis key
redis:
  database: mall
  key:
    authCode: 'ums:authCode'
    orderId: 'oms:orderId'
    member: 'ums:member'
  expire:
    authCode: 90 # 验证码超期时间
    common: 86400 # 24小时

# 消息队列定义
rabbitmq:
  queue:
    name:
      cancelOrder: cancelOrderQueue
feign:
  okhttp:
    enabled: true
ribbon:
  ConnectTimeout: 3000 #服务请求连接超时时间（毫秒）
  ReadTimeout: 3000 #服务请求处理超时时间（毫秒）